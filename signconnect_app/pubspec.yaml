name: signconnect_app
description: "SignConnect - Real-Time ISL Communication Desktop & Mobile App in Flutter"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  flutter_webrtc: ^1.6.0
  socket_io_client: ^3.1.6
  speech_to_text: ^7.4.0
  shared_preferences: ^2.5.5
  crypto: ^3.0.7
  permission_handler: ^12.0.1
  hand_landmarker: ^3.0.1
  camera: ^0.12.0+2
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_logo.png
    - assets/images/app_logo_full.png

flutter_launcher_icons:
  image_path: "assets/images/app_logo.png"
  android: "launcher_icon"
  adaptive_icon_background: "#1E1916"
  adaptive_icon_foreground: "assets/images/app_logo.png"
  remove_alpha_ios: true
