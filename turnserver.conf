# SignConnect TURN Server Configuration (coturn)
# Deploy with: sudo cp turnserver.conf /etc/turnserver.conf

# --- Listening ---
listening-port=3478
tls-listening-port=5349

# Listen on all interfaces (both LAN and public)
listening-ip=0.0.0.0

# --- Relay IP range ---
# Ports 49152-65535 are standard TURN relay port range
min-port=49152
max-port=65535

# --- Authentication ---
# Use long-term credential mechanism (HMAC-based, no plaintext passwords)
use-auth-secret
# THIS SECRET MUST MATCH the TURN_SECRET in server.js / .env
# Generate a new one with: openssl rand -hex 32
static-auth-secret=CHANGE_ME_TO_A_RANDOM_SECRET_BEFORE_DEPLOY

# --- Realm ---
realm=signconnect.turn

# --- Security ---
# Restrict relay to avoid DNS rebinding attacks
no-multicast-peers
no-cli

# Disable unused features
no-loopback-peers
no-tlsv1
no-tlsv1_1

# --- Logging ---
log-file=/var/log/turnserver.log
simple-log

# --- Performance ---
proc-quota=30
total-quota=1200
max-bps=0

# --- Network ---
# For Oracle Cloud / cloud VMs: use the server's public IP
# The deploy script auto-detects and sets this
# external-ip=<PUBLIC_IP>/<PRIVATE_IP>

# --- TCP relay (critical for mobile networks that block UDP) ---
# coturn automatically handles both UDP and TCP on the same port
# Clients should try UDP first, then fall back to TCP

# --- Allow all peer addresses (for simplicity; restrict in production if needed) ->
allowed-peer-ip=

# --- Bandwidth ---
max-channel-burst-bytes=65536
